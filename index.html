<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1020">
  <title>Il gioco di Picci Picci</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 7' shape-rendering='crispEdges'><path fill='%23e8506a' d='M1 0h2v1h1V0h2v1h1v3H6v1H5v1H4v1H3V6H2V5H1V4H0V1h1z'/></svg>">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #1a1020; overflow: hidden;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #wrap { position: fixed; inset: 0; background: #1a1020; }
    #game { position: absolute; inset: 0; }
    #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    canvas.pix { image-rendering: pixelated; image-rendering: crisp-edges; width: 100%; height: 100%; display: block; }

    #touch { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
    #touch .pad, #touch .abtn { position: absolute; pointer-events: auto; opacity: 0.5; touch-action: none; }
    #touch .pad {
      width: min(34vh, 150px); height: min(34vh, 150px);
      left: calc(env(safe-area-inset-left, 0px) + 14px);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    }
    #touch .abtn {
      width: min(20vh, 86px); height: min(20vh, 86px);
      right: calc(env(safe-area-inset-right, 0px) + 22px);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    }
    #touch .abtn.down { opacity: 0.8; transform: scale(0.92); }
    #touch .pad[data-dir="up"], #touch .pad[data-dir="down"],
    #touch .pad[data-dir="left"], #touch .pad[data-dir="right"] { opacity: 0.7; }

    #mute {
      position: absolute; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 6px);
      right: calc(env(safe-area-inset-right, 0px) + 8px);
      width: 34px; height: 34px; border-radius: 8px; border: 2px solid #2a1d1a;
      background: rgba(251, 243, 228, 0.55); color: #2a1d1a; font: bold 18px/28px monospace;
      text-align: center; padding: 0; cursor: pointer; opacity: 0.7;
    }
    #mute.off { opacity: 0.45; text-decoration: line-through; }

    #rotate {
      display: none; position: fixed; inset: 0; z-index: 20; background: #2e2350;
      color: #fbf3e4; font: 20px/1.4 monospace; text-align: center;
      flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    #rotate .phone {
      width: 46px; height: 76px; border: 5px solid #fbf3e4; border-radius: 8px;
      animation: turn 2s ease-in-out infinite;
    }
    @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    body.portrait #rotate { display: flex; }

    #levelselect {
      display: none; position: fixed; inset: 0; z-index: 30; background: rgba(26, 16, 32, 0.92);
      flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      font: 15px monospace; color: #fbf3e4; overflow: auto;
    }
    #levelselect p { margin: 0 0 6px; color: #f29bb0; }
    #levelselect button {
      font: 15px monospace; padding: 6px 14px; min-width: 240px; border-radius: 6px;
      border: 2px solid #2a1d1a; background: #fbf3e4; color: #2a1d1a; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="game"></div>
    <div id="touch"></div>
    <button id="mute" aria-label="Audio"></button>
  </div>
  <div id="rotate"><div class="phone"></div><div>Gira il telefono<br>in orizzontale ♥</div></div>
  <div id="levelselect"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/4.0.0/phaser.min.js"></script>
  <script src="src/pixels.js"></script>
  <script src="src/font.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/controls.js"></script>
  <script src="src/save.js"></script>
  <script src="src/art.js"></script>
  <script src="src/scenery.js"></script>
  <script src="src/dialog.js"></script>
  <script src="src/actors.js"></script>
  <script src="src/base.js"></script>
  <script src="src/grid.js"></script>
  <script src="src/BootScene.js"></script>
  <script src="src/TitleScene.js"></script>
  <script src="src/LevelCompleteScene.js"></script>
  <script src="src/Level1Scene.js"></script>
  <script src="src/Level2Scene.js"></script>
  <script src="src/Level3Scene.js"></script>
  <script src="src/toiletBattle.js"></script>
  <script src="src/LondonNightScene.js"></script>
  <script src="src/FinaleScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
